name: deploy-staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate curriculum and coverage
        working-directory: app
        run: |
          node scripts/build_curriculum.mjs
          node scripts/build_coverage.mjs
          node --check server.js
          node --check oidc.js
      - name: Fail if the build changed tracked files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated content is out of date. Run npm run preflight and commit."
            git status --porcelain
            exit 1
          fi

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Validate staging secrets
        run: |
          missing=""
          [ -n "${{ secrets.STAGING_HOST }}" ] || missing="$missing STAGING_HOST"
          [ -n "${{ secrets.STAGING_USER }}" ] || missing="$missing STAGING_USER"
          [ -n "${{ secrets.STAGING_SSH_KEY }}" ] || missing="$missing STAGING_SSH_KEY"
          [ -n "${{ secrets.STAGING_KNOWN_HOSTS }}" ] || missing="$missing STAGING_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Missing Actions secrets:$missing. They must be repository (or staging environment) secrets, not variables."
            exit 1
          fi
          case "${{ secrets.STAGING_SSH_KEY }}" in
            *"BEGIN OPENSSH PRIVATE KEY"*|*"BEGIN RSA PRIVATE KEY"*) ;;
            *) echo "::error::STAGING_SSH_KEY is not a private key. Paste ~/.ssh/lms_deploy in full, including the BEGIN and END lines."; exit 1 ;;
          esac

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.STAGING_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" \
            'echo "connected as $(id -un)@$(hostname)"'

      - name: Pull on staging, restart, health check
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" \
            'bash /opt/lms/repo/app/deploy/pull-deploy.sh'
