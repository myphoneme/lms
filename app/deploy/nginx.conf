# NOT FOR THE CURRENT STAGING HOST: it already runs Caddy for another product.
# Use deploy/Caddyfile.lms there. This file is for a dedicated LMS VM only.

# /etc/nginx/sites-available/lms.conf
# TLS certificates from: certbot certonly --nginx -d lms.phoneme.in -d staging.phoneme.in

server {
    listen 80;
    listen [::]:80;
    server_name lms.phoneme.in staging.phoneme.in;
    return 301 https://lms.phoneme.in$request_uri;
}

# Staging hostname stays as an alias; the product URL is lms.phoneme.in.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.phoneme.in;

    ssl_certificate     /etc/letsencrypt/live/lms.phoneme.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms.phoneme.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://lms.phoneme.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lms.phoneme.in;

    ssl_certificate     /etc/letsencrypt/live/lms.phoneme.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms.phoneme.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Certificate print/download is small; evidence text is capped in the app.
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Long-lived assets; HTML is no-store from the app itself.
    location /css/  { proxy_pass http://127.0.0.1:4173; expires 7d; }
    location /js/   { proxy_pass http://127.0.0.1:4173; expires 7d; }
    location /downloads/ { proxy_pass http://127.0.0.1:4173; expires 1h; }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
